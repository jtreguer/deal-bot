# Phase 1 sources.
ebay:
  # Browse API; needs EBAY_CLIENT_ID and EBAY_CLIENT_SECRET in .env.
  marketplaces: [EBAY_FR, EBAY_DE, EBAY_IT, EBAY_ES, EBAY_NL, EBAY_BE, EBAY_AT, EBAY_IE, EBAY_GB]
  category_ids: "177"   # PC laptops & netbooks, the same ID on every marketplace
shopify:
  - name: cybist
    base_url: https://cybist.com
    country: GB
    currency: GBP
    price_includes_local_vat: true
    export_zero_rated: unknown   # yes | no | unknown; unknown assumes UK VAT is not refunded
    delivery: ships_fr
    shipping_estimate_eur: 60    # ships abroad on quote only
  # Wisetek's EU storefront (IE, EUR) had 5690s in the survey; its URL is still to be found.
  # wisetekmarket.com is the US store and does not apply.
woocommerce:
  - name: silicon-connect
    base_url: https://siliconconnect.co.uk
    country: GB
    currency: GBP
    price_includes_local_vat: true
    export_zero_rated: unknown
    delivery: ships_fr
    shipping_estimate_eur: 60
  - name: estunt
    base_url: https://www.estunt.nl
    country: NL
    currency: EUR
    delivery: ships_fr
    shipping_estimate_eur: 25
  - name: dubbelgaaf
    base_url: https://www.dubbelgaaf.nl
    country: NL
    currency: EUR
    delivery: ships_fr
    shipping_estimate_eur: 25
refurbed:
  domains: [fr, de, at, nl, it, be]
