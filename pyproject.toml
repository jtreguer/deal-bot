[project]
name = "deal-bot"
version = "0.1.0"
description = "Finds and ranks used and refurbished laptop deals across European marketplaces"
readme = "README.md"
authors = [
    { name = "Julien Treguer", email = "julien@treguer.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.13",
    "typer>=0.27.2",
]

[project.scripts]
deal-bot = "deal_bot.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the Claude API (needs credentials, costs money)"]
addopts = "-m 'not live'"
